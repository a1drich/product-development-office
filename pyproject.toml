[project]
name = "product-development-office"
version = "0.1.0"
description = "Agent swarm that develops a GitHub repo until it is blocked on a human decision"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.64.0",
    "psycopg[binary]>=3.2",
]

[project.scripts]
office = "office.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["office"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
